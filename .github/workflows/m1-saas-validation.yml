name: M1 SaaS foundation validation

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/portal/**'
      - 'db/**'
      - 'src/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m1-saas-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-regression:
    name: Legacy application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  api-build-and-isolation:
    name: API build and PostgreSQL RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: gst_saas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gst_saas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: gst_saas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary npm install until a reviewed apps/api/package-lock.json is checked in.
      - run: npm install --no-audit --no-fund
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api
      - run: node --test tests/registration-policy.test.mjs
        working-directory: apps/api
      - run: node --test tests/mail-crypto.test.mjs
        working-directory: apps/api
      - name: Apply migrations and seed disposable CI database
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE gst_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci_app_only';"
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_saas_foundation.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_identity_sessions.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0003_subscription_catalog.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0004_registration_onboarding.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0005_registration_security.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0006_registration_mail_outbox.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/ci_registration.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/ci_seed.sql
      - name: Verify isolated tenant reads under restricted role
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://gst_app:ci_app_only@127.0.0.1:5432/gst_saas_ci
          TEST_TENANT_A: 11111111-1111-4111-8111-111111111111
          TEST_TENANT_B: 22222222-2222-4222-8222-222222222222
        run: npm run test:rls
      - name: Upload generated API lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-api-generated-package-lock
          path: apps/api/package-lock.json
          if-no-files-found: ignore
          retention-days: 7

  saas-portal-build:
    name: Standalone SaaS portal build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build portal for dedicated staging API domain
        env:
          VITE_API_BASE_URL: https://gst-api-dev.udaanhost.com/api/v1
        run: npm run build
      - run: node --test tests/*.test.mjs
      - name: Package browser portal for Plesk upload
        uses: actions/upload-artifact@v4
        with:
          name: gst-saas-portal-staging
          path: apps/portal/dist/
          if-no-files-found: error
          retention-days: 14
